<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIRAL FINDER</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <!-- Header -->
  <header class="border-b border-slate-800 p-4 flex justify-between items-center max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold bg-gradient-to-r from-pink-500 to-cyan-400 bg-clip-text text-transparent">
      VIRAL FINDER
    </h1>
    <nav class="space-x-4 text-sm">
      <a href="#" onclick="showSection('dashboard')" class="hover:text-pink-400 font-semibold">Dashboard</a>
      <a href="#" onclick="showSection('cortes')" class="hover:text-pink-400 text-slate-400">Cortes</a>
      <a href="#" onclick="showSection('ideias')" class="hover:text-pink-400 text-slate-400">Ideias</a>
    </nav>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    <!-- DASHBOARD SECTION -->
    <section id="sec-dashboard" class="space-y-4">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex flex-wrap gap-3 items-center">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Nicho</label>
          <select id="nicheSelect" class="bg-slate-800 text-white px-3 py-2 rounded-lg border border-slate-700 text-sm focus:outline-none">
            <option value="Todos os Nichos">Todos os Nichos</option>
            <option value="Humor">Humor</option>
            <option value="Motivacao">Motivação</option>
            <option value="Financas">Finanças</option>
            <option value="Games">Games</option>
            <option value="Culinaria">Culinária</option>
          </select>
        </div>
        <button onclick="fetchVirals()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold px-5 py-2 rounded-lg mt-5 text-sm transition">
          Atualizar
        </button>
      </div>

      <!-- Tabela de Vídeos -->
      <div class="bg-slate-900 rounded-xl border border-slate-800 overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-800/50 text-slate-400 border-b border-slate-800">
            <tr>
              <th class="p-3">CRIADOR</th>
              <th class="p-3">NICHO</th>
              <th class="p-3">VIEWS</th>
              <th class="p-3">AÇÃO</th>
            </tr>
          </thead>
          <tbody id="viralsTable" class="divide-y divide-slate-800/50">
            <!-- Os vídeos vão carregar aqui -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- CORTES SECTION -->
    <section id="sec-cortes" class="hidden space-y-4">
      <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 text-center space-y-4">
        <h2 class="text-xl font-bold">Analisador de Retenção para Cortes</h2>
        <p class="text-sm text-slate-400">Cole o link de um vídeo para achar os momentos virais.</p>
        <div class="flex gap-2 max-w-md mx-auto">
          <input type="text" placeholder="Cole o link do TikTok..." class="bg-slate-800 px-4 py-2 rounded-lg border border-slate-700 text-sm w-full text-white">
          <button onclick="alert('Analisando pontos de alta retenção no vídeo...')" class="bg-cyan-600 px-4 py-2 rounded-lg text-sm font-bold">Analisar</button>
        </div>
      </div>
    </section>

    <!-- IDEIAS SECTION -->
    <section id="sec-ideias" class="hidden space-y-4">
      <h2 class="text-xl font-bold">Ideias Salvas</h2>
      <div id="ideasContainer" class="grid gap-3">
        <!-- Ideias salvas aparecem aqui -->
      </div>
    </section>
  </main>

  <script>
    function showSection(name) {
      document.getElementById('sec-dashboard').classList.add('hidden');
      document.getElementById('sec-cortes').classList.add('hidden');
      document.getElementById('sec-ideias').classList.add('hidden');
      document.getElementById(`sec-${name}`).classList.remove('hidden');
      if (name === 'ideias') loadIdeas();
    }

    async function fetchVirals() {
      const niche = document.getElementById('nicheSelect').value;
      const res = await fetch(`/api/virals?niche=${encodeURIComponent(niche)}`);
      const videos = await res.json();
      
      const tbody = document.getElementById('viralsTable');
      tbody.innerHTML = '';

      videos.forEach(v => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-800/30 transition">
            <td class="p-3 font-semibold text-pink-400">${v.creator}</td>
            <td class="p-3"><span class="bg-slate-800 px-2 py-1 rounded text-xs">${v.niche}</span></td>
            <td class="p-3">${v.views}</td>
            <td class="p-3 flex gap-2">
              <a href="${v.link}" target="_blank" class="bg-pink-600 hover:bg-pink-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1">
                Assistir ↗
              </a>
              <button onclick='saveIdea(${JSON.stringify(v)})' class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700">
                ⭐ Salvar
              </button>
            </td>
          </tr>
        `;
      });
    }

    async function saveIdea(video) {
      await fetch('/api/ideas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(video)
      });
      alert('Vídeo salvo na aba Ideias!');
    }

    async function loadIdeas() {
      const res = await fetch('/api/ideas');
      const ideas = await res.json();
      const container = document.getElementById('ideasContainer');
      container.innerHTML = ideas.length ? '' : '<p class="text-slate-500 text-sm">Nenhuma ideia salva ainda.</p>';
      
      ideas.forEach(i => {
        container.innerHTML += `
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
            <div>
              <p class="font-bold text-pink-400">${i.creator}</p>
              <p class="text-xs text-slate-400">${i.niche} • ${i.views} views</p>
            </div>
            <a href="${i.link}" target="_blank" class="bg-pink-600 text-xs font-bold px-3 py-1.5 rounded-lg">
              Abrir Vídeo
            </a>
          </div>
        `;
      });
    }

    fetchVirals();
  </script>
</body>
</html>
