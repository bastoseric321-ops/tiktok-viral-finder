<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Viral Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: '#FE2C55', brandDark: '#25F4EE' } } }
    }
  </script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col">

  <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <span class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-brand to-brandDark">
        VIRAL FINDER
      </span>
      <nav class="flex space-x-4 text-sm font-medium">
        <button onclick="switchTab('dashboard')" class="hover:text-brand">Dashboard</button>
        <button onclick="switchTab('cutter')" class="hover:text-brand">Cortes</button>
        <button onclick="switchTab('ideas')" class="hover:text-brand">Ideias</button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <section id="tab-dashboard" class="space-y-6">
      <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 flex flex-wrap gap-4 items-center justify-between">
        <div class="flex flex-wrap gap-3 items-center">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Nicho</label>
            <select id="filter-niche" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm">
              <option value="all">Todos os Nichos</option>
              <option value="humor">Humor</option>
              <option value="dancinha">Dancinhas</option>
              <option value="motivacao">Motivação</option>
              <option value="culinaria">Culinária</option>
              <option value="financas">Finanças</option>
              <option value="games">Games</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Mínimo Views</label>
            <select id="filter-views" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm">
              <option value="0">Qualquer</option>
              <option value="100000">+100k views</option>
              <option value="500000">+500k views</option>
            </select>
          </div>
        </div>
        <button onclick="fetchTrending()" class="bg-brand hover:bg-red-600 text-white px-5 py-2 rounded-lg font-semibold text-sm">
          Atualizar
        </button>
      </div>

      <div class="bg-gray-900 rounded-xl border border-gray-800 overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-300">
          <thead class="bg-gray-950/50 text-xs text-gray-400 uppercase border-b border-gray-800">
            <tr>
              <th class="p-4">Criador</th>
              <th class="p-4">Nicho</th>
              <th class="p-4">Views</th>
              <th class="p-4">Crescimento/h</th>
              <th class="p-4 text-right">Ação</th>
            </tr>
          </thead>
          <tbody id="trending-table-body" class="divide-y divide-gray-800"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-cutter" class="hidden space-y-6">
      <div class="bg-gray-900 p-6 rounded-xl border border-gray-800 max-w-2xl mx-auto text-center space-y-4">
        <h2 class="text-xl font-bold">Baixar e Cortar Vídeo</h2>
        <div class="flex gap-2">
          <input type="url" id="video-url-input" placeholder="Cole o link do TikTok aqui" class="flex-grow bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-sm">
          <button onclick="processCut()" class="bg-brand text-white px-6 py-2 rounded-lg text-sm font-semibold">Analisar</button>
        </div>
        <div id="cutter-result" class="hidden mt-6 p-4 bg-gray-950 rounded-lg border border-gray-800 text-left space-y-3">
          <p class="font-bold text-green-400 text-sm">✓ Vídeo Analisado</p>
          <ul id="highlights-list" class="text-xs text-gray-400 space-y-1"></ul>
          <a id="download-btn" href="#" target="_blank" class="block text-center bg-blue-600 text-white font-semibold py-2 rounded-lg text-sm mt-3">Baixar Corte</a>
        </div>
      </div>
    </section>

    <section id="tab-ideas" class="hidden space-y-6">
      <h2 class="text-xl font-bold">Banco de Ideias</h2>
      <div id="ideas-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
